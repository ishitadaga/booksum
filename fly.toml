app = "booksum-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  DATABASE_URL = "sqlite+aiosqlite:////data/booksum.db"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "booksum_data"
  destination = "/data"
